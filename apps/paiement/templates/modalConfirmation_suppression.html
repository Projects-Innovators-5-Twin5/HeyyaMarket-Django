<div
  class="modal fade"
  id="deleteConfirmationModalCommande"
  tabindex="-1"
  aria-labelledby="deleteConfirmModalLabelC"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteConfirmModalLabel">Confirmer la Suppression</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="modal-content-placeholder">
          <p>Êtes-vous sûr de vouloir supprimer <strong id="type-placeholder"></strong> ?</p>
        </div>
      </div>
      <div class="modal-footer">
        <form id="deleteOrderForm" method="post" action="">
          {% csrf_token %}
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-danger">Supprimer</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-bs-target="#deleteConfirmationModalCommande"]').forEach(item => {
      item.addEventListener('click', function () {
        const commandeId = this.getAttribute('data-id');
        const url = `/remove-order/${commandeId}/`;
        document.getElementById('deleteOrderForm').setAttribute('action', url);
      });
    });
  });
</script>
